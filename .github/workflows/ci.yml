# CI (D10): chạy cho mọi PR vào develop/main và mọi lần push lên develop/main.
# PR chỉ được merge khi cả hai job xanh.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend — lint + test + migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giasu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d giasu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/giasu_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.0
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - name: pytest trên PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/giasu_test
        run: uv run pytest
      - name: Kiểm tra migration từ schema InitialAuth
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d giasu_test -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY, email text, raw_user_meta_data jsonb);'
          uv run alembic upgrade 0001_initial_auth
          PGPASSWORD=postgres psql -h localhost -U postgres -d giasu_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (id, role_id, full_name, login_identifier, credential_reference, is_active, token_version, created_at) VALUES ('11111111-1111-1111-1111-111111111111', 2, 'Legacy CI', 'legacy.ci@example.com', 'legacy-hash', true, 7, now());"
          uv run alembic upgrade head
          PGPASSWORD=postgres psql -h localhost -U postgres -d giasu_test -At -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM users WHERE id='11111111-1111-1111-1111-111111111111' AND credential_reference='legacy-hash' AND token_version=7 AND auth_user_id IS NULL;" \
            | grep -qx 1
          PGPASSWORD=postgres psql -h localhost -U postgres -d giasu_test -v ON_ERROR_STOP=1 \
            -c "INSERT INTO auth.users (id, email, raw_user_meta_data) VALUES ('22222222-2222-2222-2222-222222222222', 'new.tutor@example.com', '{\"registration_source\":\"giasu-register\",\"role\":\"Tutor\",\"full_name\":\"New Tutor\",\"phone\":\"0912345678\",\"accept_terms\":true}');"
          PGPASSWORD=postgres psql -h localhost -U postgres -d giasu_test -At -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM users u JOIN tutors t ON t.user_id=u.id WHERE u.auth_user_id='22222222-2222-2222-2222-222222222222' AND u.login_identifier='new.tutor@example.com' AND u.role_id=2 AND t.verification_status='Unverified';" \
            | grep -qx 1
      - name: Kiểm tra CHECK sau migration
        env:
          MIGRATED_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/giasu_test
        run: uv run pytest tests/test_migration_checks.py

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
